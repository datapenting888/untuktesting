<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latar Belakang Gold Estetik</title>
    <style>
        /* Mengatur reset dasar dan memastikan layar penuh */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0906; /* Latar belakang gelap bernuansa mewah */
        }

        /* Kontainer Utama Efek Fenomena Emas */
        .gold-phenomenon {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(125deg, #1a1405, #33260a, #120d04);
            background-size: 400% 400%;
            animation: gradientAnimation 15s ease infinite;
            z-index: 1;
        }

        /* Lapisan Cahaya Berkilau (Glow & Particles Effect) */
        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
            animation: floatOrb 10s ease-in-out infinite alternate;
            z-index: 2;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: #d4af37; /* Gold klasik */
            top: -10%;
            left: -10%;
            animation-duration: 12s;
        }

        .orb-2 {
            width: 500px;
            height: 500px;
            background: #aa771c; /* Gold gelap/perunggu */
            bottom: -20%;
            right: -10%;
            animation-duration: 15s;
            animation-delay: -3s;
        }

        .orb-3 {
            width: 300px;
            height: 300px;
            background: #ffd700; /* Gold terang */
            top: 40%;
            left: 40%;
            opacity: 0.3;
            animation-duration: 8s;
            animation-delay: -5s;
        }

        /* Animasi Pergerakan Gradasi Latar Belakang */
        @keyframes gradientAnimation {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        /* Animasi Mengambang untuk Bola Cahaya */
        @keyframes floatOrb {
            0% {
                transform: translate(0, 0) scale(1);
            }
            50% {
                transform: translate(50px, 80px) scale(1.1);
            }
            100% {
                transform: translate(-30px, 50px) scale(0.9);
            }
        }

        /* Konten Opsional di Atas Latar Belakang */
        .content {
            position: relative;
            z-index: 10;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #f3e5ab;
            padding: 0 20px;
        }

        .content h1 {
            font-size: 3rem;
            font-weight: 300;
            letter-spacing: 4px;
            margin-bottom: 15px;
            text-shadow: 0 2px 20px rgba(212, 175, 55, 0.4);
            background: linear-gradient(to right, #bf953f, #fc6, #fbf5b7, #f7ef8a, #aa771c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .content p {
            font-size: 1.1rem;
            letter-spacing: 2px;
            color: #d1c7a3;
            font-weight: 300;
        }
    </style>
</head>
<body>

    <!-- Elemen Latar Belakang Fenomena Gold -->
    <div class="gold-phenomenon"></div>
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
    <div class="glow-orb orb-3"></div>

    <!-- Teks Contoh di Atas Latar Belakang -->
    <div class="content">
        <h1>ELEGANCE & LUXURY</h1>
        <p>Fenomena Estetik Nuansa Keemasan</p>
    </div>

</body>
</html>
